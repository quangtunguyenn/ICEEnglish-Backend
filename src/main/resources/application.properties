spring.application.name=iceenglish


spring.datasource.url=jdbc:postgresql://localhost:5432/ICEEnglish
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Run the application host with NTP synchronization; the application uses Vietnam time for local timestamps.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Gom INSERT/UPDATE thành batch (nộp bài ghi hàng trăm dòng sub_details).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection pool: mặc định 10 là quá nhỏ khi nhiều học sinh thao tác cùng lúc.
# Tổng kết nối (pool x số instance) phải nhỏ hơn max_connections của PostgreSQL (mặc định 100).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=20000
# Driver gộp các INSERT trong batch thành INSERT nhiều dòng (nộp bài ghi ~100 dòng sub_details mỗi lượt).
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Nén JSON (đề thi có thể vài trăm KB).
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Tomcat: nhiều request đồng thời hơn mặc định (200 luồng / hàng đợi 100); mỗi request chỉ giữ kết nối DB rất ngắn.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:400}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:50}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:1000}

# Không giữ Hibernate Session (và kết nối DB) suốt vòng đời request, chỉ trong transaction của service.
spring.jpa.open-in-view=false

# Bảo vệ đăng nhập: số lượt băm BCrypt song song tối đa (0 = số lõi CPU), thời gian chờ tối đa (giây),
# số lần sai liên tiếp trước khi tạm khoá tài khoản và thời gian khoá (giây).
app.security.login.max-concurrent-hashing=0
app.security.login.hashing-wait-seconds=60
app.security.login.max-failures=10
app.security.login.lock-seconds=300

# Thời gian ân hạn (giây) cho nộp bài sau khi hết giờ, bù độ trễ khi nhiều học sinh nộp cùng lúc.
app.exam.submit-grace-seconds=30
# Thời gian cache role của user trong filter JWT (giây).
app.security.role-cache-ttl-seconds=60
# Cache nội dung (đề thi, video, từ vựng, snapshot chấm điểm): xoá ngay khi staff thay đổi trên instance đó;
# TTL là lưới an toàn khi chạy nhiều instance (thay đổi có hiệu lực trên instance khác sau tối đa chừng này giây).
app.cache.ttl-seconds=120

springdoc.swagger-ui.path=/swagger-ui.html

# Comma-separated frontend origins allowed to call the API.
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.guest.exam-ids=e9b213a4-c4b4-45cb-bb84-cca20c27f7b2, 3a2595fc-79bc-49f6-9ed9-fa709712b25f
app.guest.video-id=1effabaa-eb4c-4d03-8e51-07e723eb877a
